plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

def buildTime = new Date()
def dynamicVersionCode = buildTime.format("yyyyMMddHHmm").toInteger()
def dynamicVersionName = buildTime.format("yyyy‑MM‑dd HH:mm")

android {
    namespace 'com.android.hongguo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.android.hongguo'
        minSdk 29
        targetSdk 34
        versionCode dynamicVersionCode
        versionName dynamicVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resConfigs("zh", "en")

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    aaptOptions {
        noCompress 'so'
    }

    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def hasSigning = keystorePropsFile.exists() &&
        !keystoreProps.getProperty('storeFile', '').isBlank() &&
        !keystoreProps.getProperty('storePassword', '').isBlank() && keystoreProps.getProperty('storePassword', '') != 'FILL_ME' &&
        !keystoreProps.getProperty('keyAlias', '').isBlank() &&
        !keystoreProps.getProperty('keyPassword', '').isBlank() && keystoreProps.getProperty('keyPassword', '') != 'FILL_ME'

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs true
            zipAlignEnabled true
            debuggable false
            if (hasSigning) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
            excludes += ['**']
        }
    }
}

dependencies {
    compileOnly libs.libxposed.api

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'com.tencent:mmkv:1.3.4'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    implementation 'org.luckypray:dexkit:2.0.7'
}
